name: build_openwrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    steps:
    - name: step1
      uses: actions/checkout@v4

    - name: step2
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y build-essential gawk gettext unzip file wget python3 ccache

    - name: step3
      run: |
        A="downloads"
        B="openwrt"
        C="org"
        D="chaos_calmer/15.05.1/ar71xx/generic"
        E="OpenWrt-ImageBuilder-15.05.1-ar71xx-generic.Linux-x86_64"
        wget https://$A.$B.$C/$D/$E.tar.bz2
        tar -xjf $E.tar.bz2
        mv $E ib && cd ib
        make image PROFILE=TLMR3420V2 PACKAGES="-odhcp6c -odhcpd -ip6tables -luci-proto-ipv6"

    - name: step4
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_15.05_MR3420v2_NoIPv6
        path: ib/bin/
